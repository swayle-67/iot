<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#020202" />
    
    <!-- Primary Search Engine SEO Meta Tags -->
    <title>IoTConnect Global — M2M & IoT Connectivity MVNO | 195 Countries</title>
    <meta name="description" content="Turnkey global M2M & IoT connectivity solutions. Secure multi-network SIMs, custom APN setups, private VPN routes, and GSMA eSIM across 195 countries and 785 carrier networks." />
    <meta name="keywords" content="IoT connectivity, M2M SIM cards, global cellular MVNO, eSIM IoT, telematics SIM, multi-network roaming, Vodacom MTN Telkom Cell C roaming, SADC M2M data, custom APN, private VPN IoT" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="IoTConnect Global" />
    <meta name="application-name" content="IoTConnect Global" />
    
    <!-- Mobile Web App Capability -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IoTConnect" />
    
    <!-- Open Graph / Facebook / LinkedIn Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IoTConnect Global" />
    <meta property="og:title" content="IoTConnect Global — M2M & IoT Connectivity MVNO | 195 Countries" />
    <meta property="og:description" content="Turnkey global M2M & IoT connectivity solutions. Secure multi-network SIMs, custom APN setups, private VPN routes, and GSMA eSIM across 195 countries and 785 carrier networks." />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@IoTConnectGlobal" />
    <meta name="twitter:title" content="IoTConnect Global — M2M & IoT Connectivity MVNO" />
    <meta name="twitter:description" content="Turnkey M2M & IoT cellular connectivity across 195 countries and 785 carrier networks with automated failover." />

    <!-- Global Structured Data (JSON-LD): Organization & WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://iotconnectglobal.com/#organization",
            "name": "IoTConnect Global",
            "url": "https://iotconnectglobal.com",
            "logo": "https://iotconnectglobal.com/logo.png",
            "description": "Premier global GSM MVNO providing enterprise M2M data connectivity, custom APNs, private VPN routes, and GSMA eSIM solutions.",
            "foundingDate": "2000",
            "sameAs": [
              "https://linkedin.com/company/iotconnectglobal",
              "https://twitter.com/IoTConnectGlobal"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "technical support",
              "email": "support@iotconnectglobal.com",
              "availableLanguage": ["English"]
            },
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "ZA",
              "addressLocality": "Johannesburg"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://iotconnectglobal.com/#website",
            "url": "https://iotconnectglobal.com",
            "name": "IoTConnect Global",
            "description": "Global M2M & IoT Cellular Connectivity Platform",
            "publisher": {
              "@id": "https://iotconnectglobal.com/#organization"
            },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
